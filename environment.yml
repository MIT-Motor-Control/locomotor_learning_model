name: loco-ada
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.13
  - pip=26.0.1
  - setuptools=82.0.1
  # Pip pins avoid conflicting optional constraints in the all-Conda solve.
  - pip:
      - -r requirements-lock.txt
      - pytest==9.1.1
      - ruff==0.17.0
      - -e .[dev]
