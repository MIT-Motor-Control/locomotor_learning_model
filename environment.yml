name: loco-ada
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.13
  - pip=26.0.1
  - setuptools=82.0.1
  # Python packages are pinned through pip; an all-Conda solve conflicts on optional constraints.
  - pip:
      - -r requirements-lock.txt
      - pytest==9.1.1
      - ruff==0.17.0
      - -e .[dev]
